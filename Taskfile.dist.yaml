version: '3'

vars:
  APP_NAME: godownload
  MAIN_PKG: ./cmd/godownload
  DIST_DIR: dist
  E2E_SELF_SIGNED_SERVER: ./e2e-tests/support/selfsignedserver
  E2E_SELF_SIGNED_PORT: '18443' 
  E2E_HTTPBIN_PORT: '18080'
  E2E_HTTPBIN_NAME: 'godownload-e2e-httpbingo'
  E2E_HTTPBIN_IMAGE: 'ghcr.io/mccutchen/go-httpbin:2.26.0'
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  check:
    desc: Run the same checks as CI (formatting, vet, unit tests with the race detector)
    cmds:
      - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - go vet ./...
      - go test -race ./...

  build:
    desc: Build host binary to dist/
    cmds:
      - task: build:platform
      - cp {{.DIST_DIR}}/{{.APP_NAME}}-{{.GOOS}}-{{.GOARCH}} {{.DIST_DIR}}/{{.APP_NAME}}
    vars:
      GOOS:
        sh: go env GOOS
      GOARCH:
        sh: go env GOARCH

  build:arm64:
    desc: Cross-compile linux/arm64 binary to dist/
    cmds:
      - task: build:platform
        vars:
          GOOS: linux
          GOARCH: arm64

  build:platform:
    internal: true
    vars:
      GOOS:
        sh: go env GOOS
      GOARCH:
        sh: go env GOARCH
      BIN: '{{.DIST_DIR}}/{{.APP_NAME}}-{{.GOOS}}-{{.GOARCH}}'
    cmds:
      - mkdir -p {{.DIST_DIR}}
      - env GOOS={{.GOOS}} GOARCH={{.GOARCH}} CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version={{.VERSION}}" -o {{.BIN}} {{.MAIN_PKG}}
    sources:
      - cmd/godownload/**/*.go
      - internal/**/*.go
      - go.mod
      - go.sum
    generates:
      - '{{.BIN}}'

  e2e:clean:
    internal: true
    cmds:
      - cmd: rm -rf e2e-tests/success/d-files
        ignore_error: true
      - cmd: rm -rf e2e-tests/failures/d-files
        ignore_error: true
      - cmd: rm -rf e2e-tests/warnings/d-files
        ignore_error: true

  e2e:selfsigned:start:
    internal: true
    cmds:
      - >-
        go run {{.E2E_SELF_SIGNED_SERVER}}
        --start --restart-if-running
        --port {{.E2E_SELF_SIGNED_PORT}}

  e2e:selfsigned:stop:
    internal: true
    cmds:
      - go run {{.E2E_SELF_SIGNED_SERVER}} --stop --port {{.E2E_SELF_SIGNED_PORT}}
  
  e2e:httpbingo:start:
    internal: true
    cmds:
      - cmd: docker container rm -f {{.E2E_HTTPBIN_NAME}}
        ignore_error: true
      - docker run --name {{.E2E_HTTPBIN_NAME}} --rm -d -p {{.E2E_HTTPBIN_PORT}}:8080 {{.E2E_HTTPBIN_IMAGE}}
      - echo "httpbin running on port {{.E2E_HTTPBIN_PORT}}"
  
  e2e:httpbingo:stop:
    internal: true
    cmds:
      - docker stop {{.E2E_HTTPBIN_NAME}}
      - echo "httpbin stopped"

  e2e:seed:
    internal: true
    cmds:
      # existing files for the force_download tasks in the success suite
      - mkdir -p e2e-tests/success/d-files/force_append e2e-tests/success/d-files/force_override
      - printf 'old\n' > e2e-tests/success/d-files/force_append/force_download_test
      - printf 'old\n' > e2e-tests/success/d-files/force_override/force_download_test

  e2e-tests:
    desc: Run the success end-to-end tests
    deps:
      - e2e:clean
      - e2e:selfsigned:start
      - e2e:httpbingo:start
    cmds:
      - defer: { task: e2e:selfsigned:stop }
      - defer: { task: e2e:httpbingo:stop }
      - task: e2e:seed
      - go run {{.MAIN_PKG}} -config e2e-tests/success/download.yaml -report-file e2e-tests/success/d-files/report.json
      - jq -r -f e2e-tests/success/check.jq e2e-tests/success/d-files/report.json

  e2e-tests:warnings:
    desc: Run the warning end-to-end tests (every task must warn, none may fail)
    deps:
      - e2e:clean
      - e2e:selfsigned:start
      - e2e:httpbingo:start
    cmds:
      - defer: { task: e2e:selfsigned:stop }
      - defer: { task: e2e:httpbingo:stop }
      - go run {{.MAIN_PKG}} -config e2e-tests/warnings/download.yaml -report-file e2e-tests/warnings/d-files/report.json
      - jq -r -f e2e-tests/warnings/check.jq e2e-tests/warnings/d-files/report.json

  e2e-tests:failures:
    desc: Run the failure end-to-end tests (every task must fail)
    deps:
      - e2e:clean
      - e2e:selfsigned:start
      - e2e:httpbingo:start
    cmds:
      - defer: { task: e2e:selfsigned:stop }
      - defer: { task: e2e:httpbingo:stop }
      - go run {{.MAIN_PKG}} -config e2e-tests/failures/download.yaml -report-file e2e-tests/failures/d-files/report.json || true
      - jq -r -f e2e-tests/failures/check.jq e2e-tests/failures/d-files/report.json
